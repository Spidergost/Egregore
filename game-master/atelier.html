<!doctype html>

<head>

<style>
:root{
  --bg:#f1e8d2;--paper:#fbf6e8;--ink:#2b2118;--muted:#6f5f4c;--line:#d9c9a6;
  --accent:#8c2f2f;--accent-ink:#fff;--soft:#efe3c4;--good:#2f6b3a;--bad:#a02a2a;
  --shadow:0 1px 2px rgba(60,40,10,.12),0 6px 18px rgba(60,40,10,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15110d;--paper:#201a14;--ink:#eadfc8;--muted:#a39478;--line:#3a3025;
    --accent:#d9a441;--accent-ink:#1a140c;--soft:#2b231a;--good:#7fc08a;--bad:#e27b7b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#15110d;--paper:#201a14;--ink:#eadfc8;--muted:#a39478;--line:#3a3025;
  --accent:#d9a441;--accent-ink:#1a140c;--soft:#2b231a;--good:#7fc08a;--bad:#e27b7b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;line-height:1.2}
h2{font-size:1.35rem;margin-bottom:.6rem}
h3{font-size:1.05rem;margin:1.2rem 0 .5rem;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{padding:18px 0 8px}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top h1{font-size:1.7rem;letter-spacing:.01em}
header.top h1 span{color:var(--accent)}
header.top p{margin:0;color:var(--muted);font-size:.9rem;flex:1 1 220px}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{white-space:nowrap;border:1px solid transparent;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted)}
nav.tabs button:hover{background:var(--soft)}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
main{padding:18px 0 40px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 160px}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=text],textarea{width:100%}
textarea{min-height:140px;resize:vertical;font-family:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.btn{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
button.mini{padding:3px 8px;font-size:.85rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips .btn{padding:5px 11px;border-radius:999px;font-size:.92rem}
.hint{color:var(--muted);font-size:.85rem}
.result{margin-top:10px;min-height:84px;border:1px dashed var(--line);border-radius:10px;padding:12px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.total{font:700 3rem/1 Georgia,serif;color:var(--accent);min-width:2ch;text-align:center}
.det{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.grp i{font-style:normal;color:var(--muted);font-size:.85rem;margin-right:6px}
.die{display:inline-block;min-width:1.8em;text-align:center;padding:1px 6px;margin:1px 2px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-weight:600}
.die.drop{opacity:.4;text-decoration:line-through}
.die.crit{border-color:var(--good);color:var(--good)}
.die.fumble{border-color:var(--bad);color:var(--bad)}
.mod{font-weight:600}
ul.plain{list-style:none;margin:0;padding:0}
ul.hist li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
ul.hist li>b{font:700 1.15rem Georgia,serif;color:var(--accent);min-width:3ch}
ul.hist .det{font-size:.88rem}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pills button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field{display:grid;grid-template-columns:120px 1fr auto auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.field>label{color:var(--muted);font-size:.88rem;padding-top:3px}
.field .val{padding:2px 4px;border-radius:6px;min-height:1.5em}
.field .val:focus{outline:1px dashed var(--accent);background:var(--bg)}
.field.locked .val{font-weight:600}
@media (max-width:560px){.field{grid-template-columns:1fr auto auto}.field>label{grid-column:1/-1;padding:0}}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:12px}
.names button{text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.names button:hover{border-color:var(--accent)}
.split{display:grid;grid-template-columns:240px 1fr;gap:16px}
@media (max-width:720px){.split{grid-template-columns:1fr}}
.tlist button{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.tlist button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);font-weight:600}
.out{border-left:3px solid var(--accent);padding:6px 12px;margin:8px 0;background:var(--bg);border-radius:0 8px 8px 0}
.out small{color:var(--muted)}
table.cb{width:100%;border-collapse:collapse}
table.cb th{font-size:.8rem;text-align:left;color:var(--muted);padding:4px}
table.cb td{padding:4px;border-top:1px solid var(--line);vertical-align:middle}
table.cb input[type=number]{width:64px}
table.cb input[type=text]{min-width:90px}
table.cb tr.cur td{background:var(--soft)}
table.cb tr.cur td:first-child{box-shadow:inset 4px 0 var(--accent)}
table.cb tr.dead input[type=text]{text-decoration:line-through;opacity:.55}
.scroll{overflow-x:auto}
.note{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:var(--bg)}
.note textarea{margin-top:8px;min-height:120px}
footer{border-top:1px solid var(--line);padding:18px 0 40px;color:var(--muted);font-size:.85rem}
footer .row{margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:20;font-size:.9rem}
#toast.on{opacity:1;transform:translateX(-50%)}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;background:#fff;font:12pt/1.45 Georgia,serif}
  #printArea h2{font-size:15pt;margin:14pt 0 4pt;page-break-after:avoid}
  #printArea pre{white-space:pre-wrap;font:inherit;margin:0 0 8pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- utilitaires ---------- */
const KEY='atelier-mj-v1';
const rnd=n=>{
  if(n<=1) return 0;
  const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let x;
  do{crypto.getRandomValues(a);x=a[0];}while(x>=lim);
  return x%n;
};
const pick=a=>a[rnd(a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

const sum=(n,f)=>{let t=0;for(let i=0;i<n;i++)t+=rnd(f)+1;return t;};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1800);}
async function copy(txt){
  try{await navigator.clipboard.writeText(txt);}
  catch(e){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(_){}a.remove();}
  toast('Copié dans le presse-papiers');
}
function download(name,text,type){
  const b=new Blob([text],{type:type||'text/plain'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
}

function genName(c,nick){
  if(c==='alea') c=pick(Object.keys(CULT));
  let n;
  if(c==='humain') n=pick(HUM.first)+' '+pick(HUM.last);
  else{const d=CULT[c];n=cap(pick(d.a)+pick(d.b)+pick(d.c));}
  if(nick) n+=', dit '+pick(NICK);
  return n;
}

  if(rnd(4)===0) return 'Saint-'+pick(['Aubin','Ciran','Médard','Gilles','Léger','Ouen','Fiacre'])+'-'+pick(['des-Brumes','du-Gué','la-Forêt','sur-Marne','des-Aulnes','le-Vieux']);

  const T=TIERS[t],out=[];
  if(T.pa) out.push(sum(T.pa[0],T.pa[1])*T.pa[2]+' pièces d’argent');
  if(T.po) out.push(sum(T.po[0],T.po[1])*T.po[2]+' pièces d’or');
  const g=GEMS.slice(t*2,t*2+4);
  for(let i=between(...T.gem);i>0;i--) out.push('Gemme : '+pick(g));

  for(let i=0;i<m;i++){const f=pick(MFLAW);out.push('✨ '+pick(MTYPE)+' '+pick(MFX)+(f?', '+f:''));}

}

/* ---------- dés ---------- */
function rollExpr(expr){
  const src=String(expr).toLowerCase().replace(/\s+/g,'').replace(/d%/g,'d100').replace(/−/g,'-');
  if(!src) throw new Error('Formule vide');
  const terms=src.replace(/-/g,'+-').split('+').filter(Boolean);
  let total=0;const parts=[];
  for(const t of terms){
    const m=t.match(/^(-?)(\d*)d(\d+)(?:(kh|kl|dh|dl)(\d+))?$/);
    if(m){
      const sign=m[1]?-1:1,n=m[2]===''?1:+m[2],f=+m[3];
      if(n<1||n>100||f<2||f>1000) throw new Error('Limites : 1 à 100 dés, 2 à 1000 faces');
      const rolls=Array.from({length:n},()=>rnd(f)+1),keep=rolls.map(()=>true);
      if(m[4]){
        const k=+m[5],idx=rolls.map((_,i)=>i).sort((a,b)=>rolls[a]-rolls[b]);
        let drop;
        if(m[4]==='kh') drop=idx.slice(0,Math.max(0,n-k));
        else if(m[4]==='kl') drop=idx.slice(Math.min(n,k));
        else if(m[4]==='dl') drop=idx.slice(0,Math.min(n,k));
        else drop=idx.slice(Math.max(0,n-k));
        drop.forEach(i=>keep[i]=false);
      }
      const s=rolls.reduce((a,v,i)=>a+(keep[i]?v:0),0)*sign;
      total+=s;parts.push({label:t,rolls,keep,faces:f});
    }else if(/^-?\d+$/.test(t)){total+=+t;parts.push({mod:+t});}
    else throw new Error('Formule non reconnue : « '+t+' »');
  }
  return {expr:src,total,parts};
}
function fmtDet(r){
  return r.parts.map(p=>{
    if('mod' in p) return `<span class="mod">${p.mod<0?'−':'+'}${Math.abs(p.mod)}</span>`;
    return `<span class="grp"><i>${esc(p.label)}</i>${p.rolls.map((v,i)=>{
      let c='die';if(!p.keep[i])c+=' drop';else if(p.faces===20&&v===20)c+=' crit';else if(p.faces===20&&v===1)c+=' fumble';
      return `<b class="${c}">${v}</b>`;}).join('')}</span>`;
  }).join('');
}
function inlineDice(text){
  return text.replace(/\{([^{}]+)\}/g,(all,e)=>{try{return rollExpr(e).total;}catch(_){return all;}});
}

/* Tables */
function parseTable(txt){
  const items=[];
  txt.split('\n').forEach(l=>{
    l=l.trim();if(!l)return;
    const m=l.match(/^\[(\d+)\]\s*(.*)$/);
    items.push(m?{w:Math.max(1,+m[1]),t:m[2]}:{w:1,t:l});
  });
  return items;
}
function rollTable(tb){
  const items=parseTable(tb.entries);
  if(!items.length) return null;
  const total=items.reduce((a,i)=>a+i.w,0);let r=rnd(total),pos=r+1,it;
  for(it of items){if(r<it.w)break;r-=it.w;}
  const plain=items.every(i=>i.w===1);
  return {n:plain?pos:null,text:inlineDice(it.t),size:total};
}
function cur(){return S.tables.find(t=>t.id===ui.tbl)||S.tables[0];}

   <td><input type="text" data-cf="name" value="${esc(x.name)}" aria-label="Nom"></td><td><input type="number" data-cf="init" value="${x.init}" aria-label="Initiative"></td>
   <td><input type="number" data-cf="hp" value="${x.hp}" aria-label="PV"> <span class="hint">/ ${x.max}</span></td>
   <td style="white-space:nowrap"><button class="btn mini" data-act="chp" data-d="-1" aria-label="Retirer des PV">−</button> <button class="btn mini" data-act="chp" data-d="1" aria-label="Ajouter des PV">+</button></td>
   <td><input type="text" data-cf="note" value="${esc(x.note||'')}" placeholder="états, notes…" aria-label="Note"></td>
   <td><button class="btn mini danger" data-act="cdel" aria-label="Retirer">✕</button></td></tr>`).join('')||'<tr><td colspan="7" class="hint">Ajoutez des combattants ci-dessus.</td></tr>'}
  </tbody></table></div>
  <div class="row" style="margin-top:12px"><button class="btn" data-act="cnew">Nouveau combat (round 1)</button><button class="btn danger" data-act="cclear">Vider la liste</button></div></section>`;
}

/* Carnet */
function vCarnet(){
  view.innerHTML=`<section class="card"><h2>Carnet</h2><p class="hint" style="margin-top:0">Gardez ici vos PNJ, lieux, butins et tirages. Tout se modifie librement.</p>
  <div class="row"><button class="btn primary" data-act="nnew">+ Nouvelle note</button><button class="btn" data-act="nmd" ${S.notes.length?'':'disabled'}>⬇ Exporter en Markdown</button><button class="btn" data-act="nprint" ${S.notes.length?'':'disabled'}>🖨 Imprimer / PDF</button></div></section>
  ${S.notes.map(n=>`<div class="note" data-id="${n.id}"><div class="row"><input class="grow" type="text" data-nf="title" value="${esc(n.title)}" aria-label="Titre"><button class="btn mini" data-act="ncopy">Copier</button><button class="btn mini danger" data-act="ndel">Supprimer</button></div>
   <textarea data-nf="text" aria-label="Contenu">${esc(n.text)}</textarea></div>`).join('')||'<p class="hint">Le carnet est vide.</p>'}`;
}
function addNote(title,text){S.notes.unshift({id:uid(),title,text});save();toast('Ajouté au carnet');}
function notesMd(){return S.notes.map(n=>`## ${n.title}\n\n${n.text}\n`).join('\n');}

/* ---------- événements ---------- */
const row=el=>el.closest('[data-id]');
const ACT={
  tab:b=>{tab=b.dataset.v;location.hash=tab;render();window.scrollTo({top:0});},
  theme:()=>{const dark=matchMedia('(prefers-color-scheme:dark)').matches;const now=S.theme||(dark?'dark':'light');S.theme=now==='dark'?'light':'dark';save();applyTheme();},
  quick:b=>{$('#expr').value=b.dataset.v;doRoll(b.dataset.v);},
  adv:b=>{const e=$('#expr'),m=e.value.replace(/\s/g,'').match(/[+-]\d+$/);const x='2d20'+b.dataset.v+'1'+(m?m[0]:'');e.value=x;doRoll(x);},
  'clear-hist':()=>{S.history=[];save();drawHist();},
  gen:b=>{ui.gen=b.dataset.v;render();},
  regen:()=>{rollGen(ui.gen);render();},
  reroll:b=>{rollGen(ui.gen,b.dataset.f);render();},
  lock:b=>{ui.locks[ui.gen]=ui.locks[ui.gen]||{};ui.locks[ui.gen][b.dataset.f]=!ui.locks[ui.gen][b.dataset.f];render();},
  'gen-copy':()=>copy(genText(ui.gen)),
  'gen-keep':()=>addNote(genTitle(ui.gen),genText(ui.gen)),
  names:()=>drawNames(),
  'copy-name':b=>copy(b.textContent),
  loot:()=>{ui.loot=genLoot(+ui.tier);drawLoot();},
  'loot-copy':()=>copy(ui.loot.join('\n')),
  'loot-keep':()=>addNote('Butin ('+TIERS[ui.tier].n.toLowerCase()+')',ui.loot.map(x=>'- '+x).join('\n')),
  tsel:b=>{ui.tbl=b.dataset.id;ui.tblOut=[];render();},
  tnew:()=>{const t={id:uid(),name:'Nouvelle table',entries:'Premier résultat\nDeuxième résultat\nTroisième résultat'};S.tables.push(t);ui.tbl=t.id;ui.tblOut=[];save();render();},
  treset:()=>{presetTables().forEach(t=>S.tables.push(t));save();render();toast('Tables d’exemple ajoutées');},
  troll:()=>{const t=cur();if(!t)return;const n=Math.max(1,Math.min(20,+ui.rollN||1));ui.tblOut=[];for(let i=0;i<n;i++){const r=rollTable(t);if(r)ui.tblOut.push(r);}if(!ui.tblOut.length)toast('Table vide');drawTOut();},
  tdup:()=>{const t=cur();const c={id:uid(),name:t.name+' (copie)',entries:t.entries};S.tables.push(c);ui.tbl=c.id;ui.tblOut=[];save();render();},
  tdel:()=>{const t=cur();if(!confirm('Supprimer la table « '+t.name+' » ?'))return;S.tables=S.tables.filter(x=>x!==t);ui.tbl=null;ui.tblOut=[];save();render();},
  'tout-keep':()=>addNote(cur().name,ui.tblOut.map(r=>'- '+r.text).join('\n')),
  cnext:()=>{const c=S.combat;if(!c.list.length)return;c.turn++;if(c.turn>=c.list.length){c.turn=0;c.round++;}save();render();},
  csort:()=>{S.combat.list.sort((a,b)=>b.init-a.init);S.combat.turn=0;save();render();},
  croll:()=>{S.combat.list.forEach(x=>x.init=rnd(20)+1);S.combat.list.sort((a,b)=>b.init-a.init);S.combat.turn=0;save();render();},
  chp:(b)=>{const x=S.combat.list.find(i=>i.id===row(b).dataset.id);x.hp=Math.max(0,x.hp+(+b.dataset.d)*Math.max(1,+ui.amt||1));save();render();},
  cdel:b=>{const c=S.combat,i=c.list.findIndex(x=>x.id===row(b).dataset.id);c.list.splice(i,1);if(c.turn>i)c.turn--;if(c.turn>=c.list.length)c.turn=0;save();render();},
  cnew:()=>{S.combat.round=1;S.combat.turn=0;S.combat.list.forEach(x=>x.hp=x.max);save();render();},
  cclear:()=>{if(!confirm('Vider tout le combat ?'))return;S.combat={list:[],turn:0,round:1};save();render();},
  nnew:()=>{S.notes.unshift({id:uid(),title:'Nouvelle note',text:''});save();render();},
  ndel:b=>{if(!confirm('Supprimer cette note ?'))return;S.notes=S.notes.filter(n=>n.id!==row(b).dataset.id);save();render();},
  ncopy:b=>{const n=S.notes.find(n=>n.id===row(b).dataset.id);copy(n.title+'\n\n'+n.text);},
  nmd:()=>download('carnet-jdr.md',notesMd(),'text/markdown'),
  nprint:()=>{$('#printArea').innerHTML=S.notes.map(n=>`<h2>${esc(n.title)}</h2><pre>${esc(n.text)}</pre>`).join('');window.print();},
  'export-all':()=>download('atelier-mj-sauvegarde.json',JSON.stringify(S,null,2),'application/json'),
  'import-all':()=>$('#importFile').click(),
  wipe:()=>{if(!confirm('Effacer toutes vos données (tables, notes, combat, historique) ?'))return;try{localStorage.removeItem(KEY);}catch(e){}S=Object.assign({},{tables:presetTables(),notes:[],combat:{list:[],turn:0,round:1},history:[],theme:'',expr:'d20'});ui.tbl=null;applyTheme();render();toast('Données effacées');}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const f=ACT[b.dataset.act];if(f)f(b);
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='rollForm') doRoll($('#expr').value);
  if(e.target.id==='cbAdd'){
    const name=$('#cbName').value.trim();if(!name)return;
    const hp=Math.max(0,parseInt($('#cbHp').value)||0),init=parseInt($('#cbInit').value);
    S.combat.list.push({id:uid(),name,init:isNaN(init)?0:init,hp,max:hp,note:''});save();render();$('#cbName').focus();
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.tf){const tb=cur();tb[t.dataset.tf]=t.value;save();
    if(t.dataset.tf==='name'){const b=$(`.tlist [data-id="${tb.id}"]`);if(b)b.textContent=t.value||'(sans titre)';}
    else{const it=parseTable(tb.entries),tw=it.reduce((a,i)=>a+i.w,0);$('#tinfo').firstChild.textContent=`${it.length} entrées${tw!==it.length?` · poids total ${tw}`:''}. Une entrée par ligne. `;}}
  else if(t.dataset.nf){const n=S.notes.find(n=>n.id===row(t).dataset.id);n[t.dataset.nf]=t.value;save();}
  else if(t.dataset.f&&t.isContentEditable){ui.vals[ui.gen][t.dataset.f]=t.textContent;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ui){
    ui[t.dataset.ui]=t.type==='checkbox'?t.checked:t.value;
    if(t.dataset.ui==='culture'&&tab==='gen'){rollGen('pnj','nom');render();}
    if(t.dataset.ui==='nameCulture'||t.dataset.ui==='nameNick'||t.dataset.ui==='nameCount') drawNames();
  }
  if(t.dataset.cf){
    const x=S.combat.list.find(i=>i.id===row(t).dataset.id);
    x[t.dataset.cf]=t.type==='number'?(parseInt(t.value)||0):t.value;
    if(t.dataset.cf==='hp'&&x.hp>x.max)x.max=x.hp;
    save();render();
  }
  if(t.id==='importFile'&&t.files[0]){
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object')throw 0;
      if(!confirm('Remplacer vos données actuelles par ce fichier ?'))return;
      S=Object.assign({tables:presetTables(),notes:[],combat:{list:[],turn:0,round:1},history:[],theme:'',expr:'d20'},d);save();applyTheme();ui.tbl=null;render();toast('Import réussi');}
      catch(_){toast('Fichier invalide');}t.value='';};
    r.readAsText(t.files[0]);
  }
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==tab&&TAB_LIST.some(t=>t[0]===h)){tab=h;render();}});

render();
})();
</script>
</body>
